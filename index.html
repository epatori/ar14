<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Journal</title>
  <style>
    :root {
      --paper: #faf9f5;
      --ink: #171717;
      --muted: #73706a;
      --line: #ded9cf;
      --soft: #f2efe8;
      --accent: #8b6f3e;
      --max: 760px;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--paper);
      color: var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", "Noto Serif KR", serif;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
    }

    button,
    select,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }

    .page {
      width: min(var(--max), calc(100% - 36px));
      margin: 0 auto;
      padding: 56px 0 64px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 48px;
    }

    .site-title {
      margin: 0;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .count {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .entry {
      padding: 0 0 42px;
      margin: 0 0 42px;
      border-bottom: 1px solid var(--line);
    }

    .entry:last-child {
      margin-bottom: 0;
    }

    .number {
      color: var(--accent);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .entry h2 {
      margin: 0 0 22px;
      font-size: clamp(30px, 5.2vw, 52px);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: -0.045em;
    }

    .tldr {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 8px 18px;
      margin: 0 0 28px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.55;
    }

    .tldr dt {
      margin: 0;
      color: var(--muted);
    }

    .tldr dd {
      margin: 0;
    }

    .recommend {
      color: var(--accent);
    }

    .body {
      font-size: 17px;
      line-height: 1.95;
      letter-spacing: -0.012em;
    }

    .body > *:first-child { margin-top: 0; }
    .body > *:last-child { margin-bottom: 0; }

    .body p {
      margin: 0 0 1.1em;
    }

    .body h1,
    .body h2,
    .body h3 {
      margin: 1.6em 0 0.6em;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .body h1 { font-size: 28px; }
    .body h2 { font-size: 24px; }
    .body h3 { font-size: 20px; }

    .body blockquote {
      margin: 1.4em 0;
      padding: 0 0 0 18px;
      border-left: 1px solid var(--line);
      color: #47433c;
    }

    .body ul,
    .body ol {
      padding-left: 1.25em;
      margin: 1em 0;
    }

    .body li + li {
      margin-top: 0.35em;
    }

    .pager {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 46px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .pager button {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      min-width: 88px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .pager button:disabled {
      color: #b9b4aa;
      cursor: default;
    }

    .pager span {
      color: var(--muted);
      min-width: 72px;
      text-align: center;
    }

    .empty {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.7;
      padding: 48px 0;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 28px, var(--max));
        padding-top: 34px;
      }

      .top {
        margin-bottom: 36px;
      }

      .entry {
        padding-bottom: 34px;
        margin-bottom: 34px;
      }

      .tldr {
        grid-template-columns: 86px 1fr;
        gap: 7px 12px;
        font-size: 12px;
      }

      .body {
        font-size: 16px;
        line-height: 1.88;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1 class="site-title">Media Journal</h1>
      <div class="count" id="count">0 entries</div>
    </header>

    <section id="list" aria-live="polite"></section>

    <nav class="pager" aria-label="pagination">
      <button id="prev" type="button">Prev</button>
      <span id="pageLabel">1 / 1</span>
      <button id="next" type="button">Next</button>
    </nav>
  </main>

  <script>
    const DATA_FILE = "reviews.md";
    const PER_PAGE = 5;

    const state = {
      items: [],
      page: 1
    };

    const $list = document.getElementById("list");
    const $count = document.getElementById("count");
    const $prev = document.getElementById("prev");
    const $next = document.getElementById("next");
    const $pageLabel = document.getElementById("pageLabel");

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function inlineMarkdown(value = "") {
      return escapeHtml(value)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/`(.+?)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function bodyMarkdownToHtml(markdown = "") {
      const lines = markdown.replace(/\r\n/g, "\n").trim().split("\n");
      const blocks = [];
      let paragraph = [];
      let list = null;
      let quote = [];
      
      function flushParagraph() {
        if (!paragraph.length) return;
        blocks.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      }
      
      function flushList() {
        if (!list) return;
        if (list.type === "ol") {
          const items = list.items
            .map(item => `<li value="${item.value}">${inlineMarkdown(item.text)}</li>`).join("");
          blocks.push(`<ol>${items}</ol>`);
        } else {
          const items = list.items
            .map(item => `<li>${inlineMarkdown(item.text)}</li>`).join("");
          blocks.push(`<ul>${items}</ul>`);
        }
        list = null;
      }
      
      function flushQuote() {
        if (!quote.length) return;
        blocks.push(`<blockquote>${quote.map(line => `<p>${inlineMarkdown(line)}</p>`).join("")}</blockquote>`);
        quote = [];
      }
      
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) {
          flushParagraph();
          flushList();
          flushQuote();
          continue;
        }
        
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        
        if (heading) {
          flushParagraph();
          flushList();
          flushQuote();
          const level = heading[1].length;
          blocks.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }
        
        const quoteLine = line.match(/^>\s?(.*)$/);
        if (quoteLine) {
          flushParagraph();
          flushList();
          quote.push(quoteLine[1]);
          continue;
        }
        
        const unordered = line.match(/^[-*]\s+(.+)$/);
        if (unordered) {
          flushParagraph();
          flushQuote();

          if (!list || list.type !== "ul") {
            flushList();
            list = { type: "ul", items: [] };
          }
          
          list.items.push({ text: unordered[1] });
          continue;
        }
        
        const ordered = line.match(/^(\d+)\.\s+(.+)$/);
        if (ordered) {
          flushParagraph();
          flushQuote();
          
          if (!list || list.type !== "ol") {
            flushList();
            list = { type: "ol", items: [] };
          }
          
          list.items.push({
            value: ordered[1],
            text: ordered[2]
          });
          
          continue;
        }
        
        flushList();
        flushQuote();
        paragraph.push(line);
      }
      
      flushParagraph();
      flushList();
      flushQuote();
      
      return blocks.join("\n");
    }

    function parseFrontMatter(text = "") {
      const data = {};
      const lines = text.replace(/\r\n/g, "\n").split("\n");

      for (const line of lines) {
        const match = line.match(/^([A-Za-z0-9_\-]+):\s*(.*)$/);
        if (!match) continue;

        const key = match[1].trim();
        let value = match[2].trim();

        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
          value = value.slice(1, -1);
        }

        data[key] = value;
      }

      return data;
    }

    function parseReviews(markdown = "") {
      return markdown
        .split(/^===$/m)
        .map(chunk => chunk.trim())
        .filter(Boolean)
        .map((chunk, index) => {
          const match = chunk.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
          if (!match) return null;

          const meta = parseFrontMatter(match[1]);
          const body = match[2].trim();

          return {
            id: meta.id || `entry-${index + 1}`,
            title: meta.title || "Untitled",
            platform: meta.platform || "-",
            consumed_date: meta.consumed_date || "-",
            review_date: meta.review_date || "-",
            recommend: meta.recommend || "-",
            body
          };
        })
        .filter(Boolean);
    }

    function recommendLabel(value = "") {
      const normalized = String(value).trim().toLowerCase();
      if (["yes", "y", "true", "recommend", "recommended", "추천"].includes(normalized)) return "추천";
      if (["no", "n", "false", "not recommended", "비추천"].includes(normalized)) return "비추천";
      if (["mixed", "neutral", "보류", "중립"].includes(normalized)) return "보류";
      return value || "-";
    }

    function render() {
      const total = state.items.length;
      const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
      state.page = Math.min(Math.max(1, state.page), totalPages);

      const start = (state.page - 1) * PER_PAGE;
      const visible = state.items.slice(start, start + PER_PAGE);

      $count.textContent = `${total} ${total === 1 ? "entry" : "entries"}`;
      $pageLabel.textContent = `${state.page} / ${totalPages}`;
      $prev.disabled = state.page <= 1;
      $next.disabled = state.page >= totalPages;

      if (!visible.length) {
        $list.innerHTML = `<p class="empty">reviews.md에 표시할 항목이 없습니다.</p>`;
        return;
      }

      $list.innerHTML = visible.map((item, index) => {
        const number = String(start + index + 1).padStart(3, "0");
        return `
          <article class="entry" id="${escapeHtml(item.id)}">
            <div class="number">No. ${number}</div>
            <h2>${escapeHtml(item.title)}</h2>
            <dl class="tldr">
              <dt>플랫폼</dt><dd>${escapeHtml(item.platform)}</dd>
              <dt>감상일</dt><dd>${escapeHtml(item.consumed_date)}</dd>
              <dt>리뷰일</dt><dd>${escapeHtml(item.review_date)}</dd>
              <dt>추천</dt><dd class="recommend">${escapeHtml(recommendLabel(item.recommend))}</dd>
            </dl>
            <div class="body">${bodyMarkdownToHtml(item.body)}</div>
          </article>
        `;
      }).join("");
    }

    $prev.addEventListener("click", () => {
      state.page -= 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    $next.addEventListener("click", () => {
      state.page += 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    async function init() {
      try {
        const response = await fetch(`${DATA_FILE}?v=${Date.now()}`);
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const markdown = await response.text();
        state.items = parseReviews(markdown);
        render();
      } catch (error) {
        $list.innerHTML = `<p class="empty">reviews.md를 불러오지 못했습니다. GitHub Pages에서는 정상 작동합니다. 로컬 확인은 <code>python -m http.server 8000</code>으로 여세요.</p>`;
        $count.textContent = "0 entries";
        $prev.disabled = true;
        $next.disabled = true;
      }
    }

    init();
  </script>
</body>
</html>
